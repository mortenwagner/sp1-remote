# ---- BOOTLOADER SAFETY ----------------------------------------------------
# The SP-1 has no reset pin. The watchdog and a clean SYSTEM_OFF path are the
# only ways back to the bootloader, so these are not optional.
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y
CONFIG_POWEROFF=y
# HW_STACK_PROTECTION uses the ARM MPU as a stack guard. It excludes
# STACK_SENTINEL (which depends on !MPU_STACK_GUARD), and the hardware guard
# is the stronger of the two: it faults on the access rather than noticing a
# corrupted canary afterwards.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_ASSERT=n
CONFIG_LOG=n

CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

# ---- Panel --------------------------------------------------------------
# ADC for the two button ladders and the four faders; GPIO for the LEDs,
# the charger control lines and the button rail.
CONFIG_ADC=y
CONFIG_GPIO=y

# The LED soft-PWM ISR must not be delayed by kernel locks or other
# interrupts: edge jitter at a low duty cycle is visible as flicker.
CONFIG_ZERO_LATENCY_IRQS=y

# ---- USB CDC diagnostic console -----------------------------------------
# Nothing brings USB up by itself with the device_next stack and
# INITIALIZE_AT_BOOT=n, so board_io_init() calls sample_usbd_init_device()
# and usbd_enable(). The helper comes from the include in CMakeLists.txt.
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_HWINFO=y

# ---- USB MIDI 2, the second transmit sink ----
# Composite with the CDC console. sp1-midi ships exactly this pair, and the
# looper independently proves composite works on this hardware (UAC2 + CDC).
CONFIG_USBD_MIDI2_CLASS=y
CONFIG_SAMPLE_USBD_MANUFACTURER="Morten Wagner"
CONFIG_SAMPLE_USBD_PRODUCT="SP-1 Remote"
# 100 mA in 2 mA units. The puck runs from its own battery and barely sips
# the bus; iOS hosts reject accessories claiming more over a camera adapter.
CONFIG_SAMPLE_USBD_MAX_POWER=50

# ---- Preset storage (Phase 7) -------------------------------------------
# FLASH_PAGE_LAYOUT is needed by flash_area_erase. On nRF52840 the ARM MPU
# blocks runtime flash writes unless MPU_ALLOW_FLASH_WRITE is set: without
# it the first save faults instead of failing cleanly.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_MAIN_STACK_SIZE=2048
